server {
    listen 80;
    listen [::]:80;
    server_name shop.museumpuzzles.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/paypal-delight-ai/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://shop.museumpuzzles.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shop.museumpuzzles.com;
    ssl_certificate /etc/letsencrypt/live/museum-puzzles-shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/museum-puzzles-shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "PayPal Delight AI - private Sandbox";
    auth_basic_user_file /etc/nginx/paypal-delight-ai.htpasswd;
    # The secret is installed outside releases; never accepted from a browser header.
    set $delight_lab_token "";
    include /etc/paypal-delight-ai/nginx/*.conf;
    if (-f /var/www/paypal-delight-ai/maintenance) { return 503; }
    root /var/www/paypal-delight-ai/current/client/dist;
    index index.html;
    client_max_body_size 8m;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    access_log /var/log/nginx/paypal-delight-ai.access.log;
    error_log /var/log/nginx/paypal-delight-ai.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep Basic credentials outside the application and its logs.
        proxy_set_header Authorization "";
        proxy_set_header X-Delight-Lab-Token $delight_lab_token;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        # Photos must not spill to nginx temporary request-body files.
        client_body_buffer_size 8m;
        proxy_request_buffering off;
        # Only generation endpoints need the longer response window.
        location ~ ^/api/(?:ai-lab/runs|orders/[^/]+/gift)$ {
            proxy_pass http://127.0.0.1:8003;
            proxy_read_timeout 350s;
        }
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
