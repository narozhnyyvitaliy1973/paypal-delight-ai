server {
    listen 80;
    listen [::]:80;
    server_name 91-99-101-189.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/paypal-delight-ai/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://91-99-101-189.sslip.io$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 91-99-101-189.sslip.io;
    ssl_certificate /etc/letsencrypt/live/paypal-delight-ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paypal-delight-ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "PayPal Delight AI - private Sandbox";
    auth_basic_user_file /etc/nginx/paypal-delight-ai.htpasswd;
    root /var/www/paypal-delight-ai/current/client/dist;
    index index.html;
    client_max_body_size 8m;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    access_log /var/log/nginx/paypal-delight-ai.access.log;
    error_log /var/log/nginx/paypal-delight-ai.error.log;

    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Keep Basic credentials outside the application and its logs.
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        # Photos must not spill to nginx temporary request-body files.
        client_body_buffer_size 8m;
        proxy_request_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}
